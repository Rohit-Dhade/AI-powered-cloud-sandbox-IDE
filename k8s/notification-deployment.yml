apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  labels:
    name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification-container
        image: notification
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 4000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/readyz
            port: 4000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name: AUTH_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: AUTH_MONGODB_URI

        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_ID

        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_SECRET

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: JWT_SECRET

        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: RABBITMQ_URL

        - name: EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: google
              key: EMAIL_USER

        - name: GOOGLE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_REFRESH_TOKEN
              
        ports:
        - containerPort:  4000  
          name: noti-http