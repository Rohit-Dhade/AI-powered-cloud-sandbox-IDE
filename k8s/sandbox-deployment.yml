apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  sandbox
  template:
    metadata:
      labels:
        app:  sandbox
    spec:
      serviceAccountName:  resource-manager
      containers:
      - image:  sandbox
        imagePullPolicy: IfNotPresent
        name:  main-sandbox-container
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        env:
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: database
                key: REDIS_URL

          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt
                key: JWT_SECRET

          - name: SANDBOX_MONGODB_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: SANDBOX_MONGODB_URI

        readinessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10      
        ports:
        - containerPort:  3000
          name:  main-sandbox
  