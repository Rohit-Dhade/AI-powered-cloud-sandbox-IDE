apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    name:  auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name:  auth-container
        image: auth
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  AUTH_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: AUTH_MONGODB_URI

        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_ID

        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_SECRET


        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: JWT_SECRET

        - name: GOOGLE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_REFRESH_TOKEN

        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: RABBITMQ_URL
              
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: SESSION_SECRET

        - name: GOOGLE_CALLBACK_URL
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CALLBACK_URL
              
        ports:
        - containerPort:  3000
          name: auth-http
        
      