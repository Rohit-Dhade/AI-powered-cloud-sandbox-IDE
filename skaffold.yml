apiVersion: skaffold/v4beta13
kind: Config

build: 
  tagPolicy:
    sha256: {}
  artifacts:

    - image: ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: auth
      context: Auth
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: notification
      context: Notification
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: agent
      context: sandbox-service/agent
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: router
      context: sandbox-service/router
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: sandbox
      context: sandbox-service/server
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"

    - image: template
      context: sandbox-service/templates
      docker:
        dockerfile: dockerfile
      sync:
        infer:
          - "src/**"
   
manifests:
  rawYaml:
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/notification-deployment.yml
    - k8s/notification-service.yml
    - k8s/ingress.yml
    - k8s/rbac.yml
    